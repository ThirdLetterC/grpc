name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  msvc:
    name: Windows / MSVC / ${{ matrix.config }} / ${{ matrix.tls }} / ${{ matrix.mode }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        tls: [none, openssl]
        mode: [default]
        include:
          - config: Release
            tls: none
            mode: ipo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install libuv:x64-windows nghttp2:x64-windows openssl:x64-windows zlib:x64-windows zstd:x64-windows snappy:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install grpcio
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DGRPC_HOST_OPENSSL_EXECUTABLE=C:/Program Files/Git/usr/bin/openssl.exe" `
            -DGRPC_TLS_BACKEND=${{ matrix.tls }} `
            -DGRPC_IPO=${{ matrix.mode == 'ipo' && 'ON' || 'OFF' }} `
            -DGRPC_BUILD_SHARED=${{ matrix.mode == 'ipo' && 'OFF' || 'ON' }} `
            -DGRPC_BUILD_EXAMPLES=${{ matrix.mode == 'ipo' && 'OFF' || 'ON' }} `
            -DGRPC_PROTOBUF_C=OFF -DGRPC_FLATCC=OFF `
            -DGRPC_ZLIB=ON -DGRPC_ZSTD=ON -DGRPC_SNAPPY=ON
      - name: Build and test
        run: cmake --build build --config ${{ matrix.config }} --target check --parallel
      - name: Verify add_subdirectory consumption
        if: matrix.config == 'Release' && matrix.tls == 'openssl' && matrix.mode == 'default'
        shell: pwsh
        run: |
          cmake -S cmake/tests/consumer -B build-consumer -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DGRPC_TLS_BACKEND=none -DGRPC_PROTOBUF_C=OFF -DGRPC_FLATCC=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-consumer --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-consumer -C Release --output-on-failure

  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.allocator }} / IPO=${{ matrix.ipo || 'OFF' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-22.04 ]
        compiler: [ gcc, clang ]
        allocator: [ default ]
        include:
          - os: ubuntu-24.04
            compiler: gcc
            allocator: mimalloc
          - os: ubuntu-24.04
            compiler: gcc
            allocator: jemalloc
          - os: ubuntu-24.04
            compiler: gcc
            allocator: default
            ipo: 'ON'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libnghttp2-dev \
            zlib1g-dev \
            libzstd-dev \
            libsnappy-dev \
            libssl-dev \
            uuid-dev \
            libprotobuf-c-dev \
            protobuf-c-compiler \
            protobuf-compiler \
            libuv1-dev \
            libmimalloc-dev \
            libjemalloc-dev

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install grpcio grpcio-tools protobuf

      - name: Build grpc and examples
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DGRPC_IPO=${{ matrix.ipo || 'OFF' }} \
            -DGRPC_ALLOCATOR=${{ matrix.allocator }}
          cmake --build build --parallel 2

      - name: Run unit and integration tests
        run: |
          ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASAN / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [ gcc, clang ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libnghttp2-dev \
            zlib1g-dev \
            libzstd-dev \
            libsnappy-dev \
            libssl-dev \
            uuid-dev \
            libprotobuf-c-dev \
            protobuf-c-compiler \
            protobuf-compiler \
            libuv1-dev

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install grpcio grpcio-tools protobuf

      - name: Build and test under AddressSanitizer
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DGRPC_ASAN=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

  tls-backends:
    name: TLS / ${{ matrix.tls }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # openssl is covered by the jobs above. wolfssl and gnutls come from
        # the distribution, the others are built by scripts/build-tls-backend.sh
        tls: [ libressl, boringssl, awslc, wolfssl, gnutls, rustls ]

    env:
      TLS_PREFIX_DIR: ${{ github.workspace }}/.tls/${{ matrix.tls }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            cmake \
            ninja-build \
            libnghttp2-dev \
            zlib1g-dev \
            libssl-dev \
            uuid-dev \
            libprotobuf-c-dev \
            protobuf-c-compiler \
            protobuf-compiler \
            libuv1-dev \
            libwolfssl-dev \
            libgnutls28-dev

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install grpcio grpcio-tools protobuf

      - name: Cache the TLS library build
        if: matrix.tls != 'wolfssl' && matrix.tls != 'gnutls'
        id: tls-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TLS_PREFIX_DIR }}
          key: tls-${{ matrix.tls }}-${{ runner.os }}-${{ hashFiles('scripts/build-tls-backend.sh') }}

      - name: Build the TLS library
        if: matrix.tls != 'wolfssl' && matrix.tls != 'gnutls' && steps.tls-cache.outputs.cache-hit != 'true'
        run: scripts/build-tls-backend.sh ${{ matrix.tls }} "$TLS_PREFIX_DIR" "$RUNNER_TEMP/tls-src"

      - name: Build and test
        run: |
          cmake -S . -B build \
            -DGRPC_TLS_BACKEND=${{ matrix.tls }} \
            -DGRPC_TLS_PREFIX="$TLS_PREFIX_DIR"
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

  flatbuffers:
    name: FlatBuffers / ${{ matrix.compiler }}${{ matrix.asan == '1' && ' / ASAN' || '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            asan: '0'
          - compiler: clang
            asan: '0'
          - compiler: gcc
            asan: '1'

    env:
      FLATCC_PREFIX_DIR: ${{ github.workspace }}/.flatcc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            cmake \
            ninja-build \
            libnghttp2-dev \
            zlib1g-dev \
            libssl-dev \
            uuid-dev \
            libprotobuf-c-dev \
            protobuf-c-compiler \
            protobuf-compiler \
            libuv1-dev

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install grpcio grpcio-tools protobuf flatbuffers==25.12.19

      - name: Cache the flatcc build
        id: flatcc-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.FLATCC_PREFIX_DIR }}
          key: flatcc-${{ runner.os }}-${{ hashFiles('scripts/build-flatcc.sh') }}

      - name: Build flatcc
        if: steps.flatcc-cache.outputs.cache-hit != 'true'
        run: scripts/build-flatcc.sh "$FLATCC_PREFIX_DIR" "$RUNNER_TEMP/flatcc-src"

      - name: Build and test
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DGRPC_ASAN=${{ matrix.asan == '1' && 'ON' || 'OFF' }} \
            -DGRPC_FLATCC=ON \
            -DGRPC_FLATCC_PREFIX="$FLATCC_PREFIX_DIR"
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
